name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # Ubuntu 24.04 ainda é compatível com a versão do Playwright usada nos testes.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar testes offline
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testar interface e dados offline
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
          node tests/offline.cjs

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes do Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Preparar arquivo final
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Hinarios-Offline.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hinarios-Offline-APK
          path: release/Hinarios-Offline.apk
          if-no-files-found: error
