name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Preparar arquivo final
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/LouvaiAoSenhor.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LouvaiAoSenhor-APK
          path: release/LouvaiAoSenhor.apk
          if-no-files-found: error
