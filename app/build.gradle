plugins {
    id 'com.android.application'
}

android {
    namespace 'com.louvaiaosenhor.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.louvaiaosenhor.app'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
